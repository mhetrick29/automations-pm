# Project Manifest Template
# Copy this file to your project folder and rename to manifest.yaml

project:
  name: "Project Name"
  description: "Brief description of the project"
  status: "planning" # planning | active | on-hold | completed
  created: "YYYY-MM-DD"
  updated: "YYYY-MM-DD"

# OKRs and Goals
okrs:
  - objective: "Objective description"
    key_results:
      - description: "Key result 1"
        target: "Metric or milestone"
        status: "not-started" # not-started | in-progress | at-risk | completed
      - description: "Key result 2"
        target: "Metric or milestone"
        status: "not-started"

# Azure DevOps Work Items
# Use ADO queries or link directly to items
ado:
  organization: "msazure"
  project: "One"
  area_path: "Azure Edge and Platform\\Health and Standards\\AIOps"
  
  # Tag used to find work items for this project
  # Run "sync my ADO work items" to auto-populate epics/features below
  tag: ""  # e.g., "UIM", "SelfServe", etc.
  
  # Auto-populated by ADO sync (don't edit manually)
  # Last synced: never
  epics: []
    # - id: 12345
    #   title: "Epic title"
    #   state: "New"
    #   assigned_to: "Name"
  
  features: []
    # - id: 12346
    #   title: "Feature title"
    #   state: "Active"
  
  backlog_items: []
  tasks: []

# GitHub Repositories
github:
  repos: []
    # - name: "repo-name"
    #   url: "https://github.com/org/repo-name"
    #   description: "Purpose of this repo"
    #   branch: "main"

# External Links (SharePoint, Teams, etc.)
external_links:
  sharepoint: []
    # - name: "Design Docs Folder"
    #   url: "https://microsoft.sharepoint.com/..."
    #   description: "Shared design documents"
  
  teams_channels: []
    # - name: "Project Channel"
    #   url: "https://teams.microsoft.com/..."
  
  other: []
    # - name: "Link name"
    #   url: "https://..."
    #   type: "wiki|dashboard|external"

# Recordings (reference recordings in the central Recordings folder)
recordings: []
