  #   date: "2025-11-05"
  #   description: "What was discussed"
  #   topics: ["topic1", "topic2"]  # For cross-referencing

# Local Documents (in this project folder)
documents:
  specs: []
  presentations: []
  notes: []

# Tags for cross-project search
tags: []
  # - "intelligent-monitors"
  # - "automation"
