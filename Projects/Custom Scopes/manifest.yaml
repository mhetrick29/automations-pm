# Custom Scopes Project Manifest
# Last updated: 2026-02-23

project:
  name: "Custom Scopes"
  description: "Close the structural gaps left after the Custom Scopes launch (end of 2025) — documentation, multi-scope SLIs, full model coverage, pass-through, edge sites, and hierarchical SLIs — to transform custom scopes from a limited pilot into a fully supported, self-service product capability."
  status: "active"
  created: "2025-12-01"
  updated: "2026-02-23"

# OKRs and Goals
okrs:
  - objective: "Services can configure and use custom scopes as a fully supported, self-service capability"
    key_results:
      - description: "Scope documentation published — services understand single, combined, and hierarchical scope options"
        target: "Published docs with examples for common service patterns"
        status: "not-started"
      - description: "OPM supports custom scopes, unlocking IM scope selection UX"
        target: "OPM custom scope support shipped"
        status: "not-started"
      - description: "Multiple scopes per SLI with independent outage criteria"
        target: "AFD, ARM, Service Bus, OpenAI unblocked"
        status: "not-started"
      - description: "Full model coverage at custom scopes (DT, health-based, OPM)"
        target: "EB-only constraint removed"
        status: "not-started"
      - description: "Time-to-enable for custom scopes reduced from ~3 days to self-service"
        target: "Self-service via IM"
        status: "not-started"

